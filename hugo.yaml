# Hugo configuration file
# Dev mode: hugo server --renderSegments recent
# Only renders recent content for fast preview
segments:
  recent:
    includes:
    - kind: '{home,section,taxonomy,term}'
    - path: '{/2025/**,/2026/**,/2027/**,/about,/archives}'

title: Iago Bragas
enableEmoji: true
locale: "pt-BR"
defaultContentLanguage: "pt-br"
baseURL: "https://iagobragas.com.br/"

languages:
  pt-br:
    label: "Português"
    locale: "pt-BR"
    weight: 1
    menu:
      main:
        - name: Tema
          weight: 0
          params:
            type: theme-toggle
        - name: Sobre
          pageRef: /about
          weight: 1
        - name: Arquivo
          url: "/archives/"
          weight: 2
        - name: GitHub ↗
          url: "https://github.com/iagobragas"
          weight: 3
          params:
            icon: github
        - name: Buscar
          weight: 4
          params:
            type: search
        - name: RSS
          weight: 5
          url: "/index.xml"
          params:
            icon: rss
        - name: Idioma
          weight: 6
          params:
            type: language-switch
      sidebar:
        - name: GitHub
          weight: 1
          url: "https://github.com/iagobragas"
          params:
            icon: github
  en:
    label: "English"
    locale: "en"
    weight: 2
    title: "Iago Bragas"
    contentDir: "content"
    params:
      description: "Iago Bragas — tech, development, and whatever else."
    menu:
      main:
        - name: Theme
          weight: 0
          params:
            type: theme-toggle
        - name: About
          pageRef: /en/about
          weight: 1
        - name: Archives
          url: "/en/archives/"
          weight: 2
        - name: GitHub ↗
          url: "https://github.com/iagobragas"
          weight: 3
          params:
            icon: github
        - name: Search
          weight: 4
          params:
            type: search
        - name: RSS
          weight: 5
          url: "/en/index.xml"
          params:
            icon: rss
        - name: Language
          weight: 6
          params:
            type: language-switch
      sidebar:
        - name: GitHub
          weight: 1
          url: "https://github.com/iagobragas"
          params:
            icon: github

outputs:
  home: [HTML, RSS, SearchIndex]

outputFormats:
  SearchIndex:
    mediaType: application/json
    baseName: search-index
    isPlainText: true
    notAlternative: true

# import hextra as module
module:
  imports:
    - path: github.com/imfing/hextra
      # Default mounts, except the theme's demo logos (static/images): the site doesn't use a logo.
      mounts:
        - { source: layouts, target: layouts }
        - { source: assets, target: assets }
        - { source: i18n, target: i18n }
        - { source: data, target: data }
        - { source: archetypes, target: archetypes }
        - { source: static, target: static, files: ["! images/**"] }

markup:
  # allow raw html
  goldmark:
    renderer:
      unsafe: true

  # enable hextra syntax highlight
  highlight:
    noClasses: false

params:
  # Disable Hextra's built-in FlexSearch: it shipped a ~14 MB client index
  # (full text of every post) and rebuilt it on the main thread on first
  # keystroke, which is what made the search box feel slow. The navbar search
  # input still renders (it's menu-driven); custom JS in head-end.html wires it
  # to a DuckDuckGo `site:` query instead — zero payload, full-text, instant.
  search:
    enable: false

  navbar:
    displayTitle: true
    displayLogo: false

  footer:
    displayCopyright: true
    displayPoweredBy: true

  # Keep default youtube shortcode as configurable
  youtubeDefaults:
    iframeAllowList: "accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
    referrerpolicy: "no-referrer"
    iframeStyle: "border:0; width:100%; aspect-ratio:16/9;"

  theme:
    default: light

  author:
    name: Iago Bragas

  description: "Iago Bragas — tecnologia, desenvolvimento e o que mais interessar."
